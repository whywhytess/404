# Local development dependencies for Web Cove.
# Credentials below are for LOCAL DEVELOPMENT ONLY and are overridden in production.
name: webcove
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: webcove
      POSTGRES_PASSWORD: webcove_dev_only
      POSTGRES_DB: webcove
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U webcove -d webcove']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage for local development.
  # The SRD names MinIO, but MinIO no longer publishes community images
  # (Docker Hub / quay.io pulls fail, 2026-11-17); SeaweedFS provides the same S3 API.
  objectstore:
    image: chrislusf/seaweedfs:4.54
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    ports:
      - '127.0.0.1:59000:9000'
    volumes:
      - objdata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9000/healthz || exit 1']
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  pgdata:
  objdata:

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Task list</title>
    <link rel="stylesheet" href="style.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <h1>My tasks</h1>
    <form id="add-form">
      <label for="task">New task</label> <input id="task" required />
      <button type="submit">Add</button>
    </form>
    <ul id="tasks"></ul>
    <p><span id="count">0</span> task(s). <button type="button" id="clear">Clear all</button></p>
  </body>
</html>

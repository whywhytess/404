name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: webcove
          POSTGRES_PASSWORD: webcove_ci_only
          POSTGRES_DB: webcove_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U webcove -d webcove_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://webcove:webcove_ci_only@127.0.0.1:5432/webcove_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Start S3-compatible storage (SeaweedFS)
        run: |
          docker run -d --name objectstore -p 59000:9000 \
            -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.54 server -dir=/data -s3 -s3.port=9000 \
            -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:59000/healthz && break; sleep 1; done
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: webcove
          POSTGRES_PASSWORD: webcove_ci_only
          POSTGRES_DB: webcove_e2e
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U webcove -d webcove_e2e"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DATABASE_URL: postgres://webcove:webcove_ci_only@127.0.0.1:55432/webcove_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Start S3-compatible storage (SeaweedFS)
        run: |
          docker run -d --name objectstore -p 59000:9000 \
            -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.54 server -dir=/data -s3 -s3.port=9000 \
            -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:59000/healthz && break; sleep 1; done
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
